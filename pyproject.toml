[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fallout1resource"
version = "0.3.0"
description = "Read-only inventory and extraction tools for legally owned Fallout 1 resources"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.15.22"]

[project.scripts]
fallout1resource = "fallout1resource.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
required-version = "==0.15.22"
target-version = "py311"
line-length = 100
exclude = ["workspace"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
