[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fallout1resource"
version = "0.1.0"
description = "Read-only inventory and extraction tools for legally owned Fallout 1 resources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fallout1resource = "fallout1resource.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

