<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", sans-serif; fill: #f1ddac; }
      .sub { font: 20px -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", sans-serif; fill: #bda97c; }
      .label { font: 700 24px -apple-system, BlinkMacSystemFont, "Noto Sans CJK SC", sans-serif; fill: #f8e8bc; }
      .meta { font: 17px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #cdb98b; }
      .line { fill: none; stroke: #e0b45b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #f6d279; stroke: #3c2917; stroke-width: 3; }
      .box { fill: #261e17; fill-opacity: 0.94; stroke: #9f7b3d; stroke-width: 2; rx: 10; }
    </style>
  </defs>
  <rect width="1400" height="900" fill="#15120f"/>
  <text x="700" y="44" text-anchor="middle" class="title">Brotherhood of Steel 钢铁兄弟会</text>
  <text x="700" y="72" text-anchor="middle" class="sub">TWNMAP07.FRM · 原始城镇海报与五个可选区域</text>
  <rect x="329" y="91" width="742" height="726" rx="18" fill="#080706" stroke="#59462e" stroke-width="5" filter="url(#shadow)"/>
  <image x="338" y="99" width="724.8" height="710.4" xlink:href="brotherhood-town-map-original.png" image-rendering="pixelated"/>

  <!-- Entrance (172,167) => (613.2,366.2) -->
  <polyline class="line" points="613,366 565,335 450,300 318,300"/>
  <circle class="dot" cx="613" cy="366" r="7"/>
  <rect class="box" x="48" y="253" width="270" height="92"/>
  <text class="label" x="68" y="286">Entrance 入口</text>
  <text class="meta" x="68" y="319">BROHDENT · elevation 0</text>

  <!-- Level 1 (254,194) => (744.4,409.4) -->
  <polyline class="line" points="744,409 845,347 1050,300 1082,300"/>
  <circle class="dot" cx="744" cy="409" r="7"/>
  <rect class="box" x="1082" y="253" width="270" height="92"/>
  <text class="label" x="1102" y="286">Level 1 第一层</text>
  <text class="meta" x="1102" y="319">BROHD12 · elevation 0</text>

  <!-- Level 2 (136,263) => (555.6,519.8) -->
  <polyline class="line" points="556,520 475,503 390,482 318,482"/>
  <circle class="dot" cx="556" cy="520" r="7"/>
  <rect class="box" x="48" y="435" width="270" height="92"/>
  <text class="label" x="68" y="468">Level 2 第二层</text>
  <text class="meta" x="68" y="501">BROHD12 · elevation 1</text>

  <!-- Level 3 (280,306) => (786,588.6) -->
  <polyline class="line" points="786,589 887,565 1010,530 1082,530"/>
  <circle class="dot" cx="786" cy="589" r="7"/>
  <rect class="box" x="1082" y="483" width="270" height="92"/>
  <text class="label" x="1102" y="516">Level 3 第三层</text>
  <text class="meta" x="1102" y="549">BROHD34 · elevation 0</text>

  <!-- Level 4 (161,373) => (595.6,695.8) -->
  <polyline class="line" points="596,696 487,710 390,714 318,714"/>
  <circle class="dot" cx="596" cy="696" r="7"/>
  <rect class="box" x="48" y="667" width="270" height="92"/>
  <text class="label" x="68" y="700">Level 4 第四层</text>
  <text class="meta" x="68" y="733">BROHD34 · elevation 1</text>

  <text x="700" y="858" text-anchor="middle" class="sub">坐标按原图 453×444 记录；毁坏入口 BRODEAD 复用入口按钮，不另占海报热点</text>
</svg>
