<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1500" viewBox="0 0 1400 1500" role="img" aria-labelledby="title description">
  <title id="title">Fallout 1 世界地图中英文地点标注</title>
  <desc id="description">在原始世界地图底图上标注十二个固定地点的英文名、中文名和资源坐标。</desc>
  <image href="world-map-original.png" x="0" y="0" width="1400" height="1500"/>

  <defs>
    <filter id="label-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feComponentTransfer in="offsetBlur" result="shadow">
        <feFuncA type="linear" slope="0.75"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .connector { stroke: #b6ff65; stroke-width: 3; stroke-linecap: round; opacity: 0.95; }
      .marker { fill: #e8ffc8; stroke: #274814; stroke-width: 3; }
      .box { fill: #071109; fill-opacity: 0.9; stroke: #91e84a; stroke-width: 2; }
      .en { fill: #e8ffd0; font: 500 22px "Verdana", "Helvetica Neue", sans-serif; letter-spacing: 0.4px; }
      .zh { fill: #ffffff; font: 500 20px "PingFang SC", "Heiti SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <g id="military-base" filter="url(#label-shadow)">
    <line class="connector" x1="175" y1="75" x2="150" y2="110"/>
    <circle class="marker" cx="175" cy="75" r="7"/>
    <rect class="box" x="40" y="110" width="220" height="66" rx="8"/>
    <text class="en" x="55" y="137">Military Base</text>
    <text class="zh" x="55" y="163">军事基地</text>
  </g>

  <g id="vault-13" filter="url(#label-shadow)">
    <line class="connector" x1="825" y1="75" x2="800" y2="105"/>
    <circle class="marker" cx="825" cy="75" r="7"/>
    <rect class="box" x="690" y="105" width="220" height="66" rx="8"/>
    <text class="en" x="705" y="132">Vault 13</text>
    <text class="zh" x="705" y="158">13号避难所</text>
  </g>

  <g id="shady-sands" filter="url(#label-shadow)">
    <line class="connector" x1="1075" y1="75" x2="1060" y2="105"/>
    <circle class="marker" cx="1075" cy="75" r="7"/>
    <rect class="box" x="930" y="105" width="220" height="66" rx="8"/>
    <text class="en" x="945" y="132">Shady Sands</text>
    <text class="zh" x="945" y="158">沙荫镇</text>
  </g>

  <g id="vault-15" filter="url(#label-shadow)">
    <line class="connector" x1="1275" y1="75" x2="1275" y2="105"/>
    <circle class="marker" cx="1275" cy="75" r="7"/>
    <rect class="box" x="1170" y="105" width="200" height="66" rx="8"/>
    <text class="en" x="1185" y="132">Vault 15</text>
    <text class="zh" x="1185" y="158">15号避难所</text>
  </g>

  <g id="raiders" filter="url(#label-shadow)">
    <line class="connector" x1="1125" y1="175" x2="1070" y2="205"/>
    <circle class="marker" cx="1125" cy="175" r="7"/>
    <rect class="box" x="915" y="205" width="220" height="66" rx="8"/>
    <text class="en" x="930" y="232">Raiders</text>
    <text class="zh" x="930" y="258">歹徒</text>
  </g>

  <g id="brotherhood" filter="url(#label-shadow)">
    <line class="connector" x1="625" y1="475" x2="595" y2="463"/>
    <circle class="marker" cx="625" cy="475" r="7"/>
    <rect class="box" x="360" y="430" width="235" height="66" rx="8"/>
    <text class="en" x="375" y="457">Brotherhood</text>
    <text class="zh" x="375" y="483">钢铁兄弟会</text>
  </g>

  <g id="junktown" filter="url(#label-shadow)">
    <line class="connector" x1="875" y1="525" x2="920" y2="498"/>
    <circle class="marker" cx="875" cy="525" r="7"/>
    <rect class="box" x="920" y="465" width="210" height="66" rx="8"/>
    <text class="en" x="935" y="492">Junktown</text>
    <text class="zh" x="935" y="518">迦克镇</text>
  </g>

  <g id="necropolis" filter="url(#label-shadow)">
    <line class="connector" x1="1125" y1="675" x2="1170" y2="653"/>
    <circle class="marker" cx="1125" cy="675" r="7"/>
    <rect class="box" x="1170" y="620" width="210" height="66" rx="8"/>
    <text class="en" x="1185" y="647">Necropolis</text>
    <text class="zh" x="1185" y="673">大墓地</text>
  </g>

  <g id="the-hub" filter="url(#label-shadow)">
    <line class="connector" x1="875" y1="725" x2="845" y2="723"/>
    <circle class="marker" cx="875" cy="725" r="7"/>
    <rect class="box" x="625" y="690" width="220" height="66" rx="8"/>
    <text class="en" x="640" y="717">The Hub</text>
    <text class="zh" x="640" y="743">哈勃城</text>
  </g>

  <g id="boneyard" filter="url(#label-shadow)">
    <line class="connector" x1="775" y1="925" x2="740" y2="908"/>
    <circle class="marker" cx="775" cy="925" r="7"/>
    <rect class="box" x="505" y="875" width="235" height="66" rx="8"/>
    <text class="en" x="520" y="902">Boneyard</text>
    <text class="zh" x="520" y="928">晒骨场</text>
  </g>

  <g id="cathedral" filter="url(#label-shadow)">
    <line class="connector" x1="775" y1="1025" x2="820" y2="1068"/>
    <circle class="marker" cx="775" cy="1025" r="7"/>
    <rect class="box" x="820" y="1040" width="220" height="66" rx="8"/>
    <text class="en" x="835" y="1067">Cathedral</text>
    <text class="zh" x="835" y="1093">大教堂</text>
  </g>

  <g id="the-glow" filter="url(#label-shadow)">
    <line class="connector" x1="1225" y1="1275" x2="1210" y2="1320"/>
    <circle class="marker" cx="1225" cy="1275" r="7"/>
    <rect class="box" x="990" y="1320" width="220" height="66" rx="8"/>
    <text class="en" x="1005" y="1347">The Glow</text>
    <text class="zh" x="1005" y="1373">闪光之地</text>
  </g>
</svg>
