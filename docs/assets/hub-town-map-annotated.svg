<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <style>
      .title { font: 700 28px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #eee3c4; }
      .subtitle { font: 14px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #b8ad94; }
      .label-main { font: 700 18px "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #f8f5eb; }
      .label-coord { font: 13px ui-monospace, "SFMono-Regular", Menlo, monospace; fill: #b9eefd; }
      .label-box { fill: #111719; fill-opacity: 0.94; stroke: #63d8ee; stroke-width: 2; filter: url(#shadow); }
      .leader { fill: none; stroke: #63d8ee; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .target { fill: #0b1113; stroke: #63d8ee; stroke-width: 3; }
      .number { font: 700 12px ui-monospace, monospace; fill: #9decfa; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#0d1112"/>
  <text x="640" y="40" class="title" text-anchor="middle">Hub 哈勃城城镇地图</text>
  <text x="640" y="64" class="subtitle" text-anchor="middle">双侧引线标注模板 · 坐标原点为原始海报左上角</text>

  <!-- Source poster: 453 × 444, scaled uniformly by 1.6. -->
  <rect x="272" y="84" width="736.8" height="722.4" rx="10" fill="#080a0a" stroke="#635e51" stroke-width="2"/>
  <image x="278" y="90" width="724.8" height="710.4" xlink:href="hub-town-map-original.png"/>

  <!-- Heights: visual source anchor (151,136) -> display (519.6,307.6). -->
  <polyline class="leader" points="519.6,307.6 268,307.6 246,266"/>
  <circle class="target" cx="519.6" cy="307.6" r="10"/>
  <text class="number" x="519.6" y="307.6">1</text>
  <rect class="label-box" x="20" y="220" width="226" height="92" rx="8"/>
  <text class="label-main" x="40" y="253">高地区 / The Heights</text>
  <text class="label-coord" x="40" y="281">标注点：151, 136</text>

  <!-- Downtown: visual source anchor (185,198) -> display (574,406.8). -->
  <polyline class="leader" points="574,406.8 268,406.8 246,426"/>
  <circle class="target" cx="574" cy="406.8" r="10"/>
  <text class="number" x="574" y="406.8">2</text>
  <rect class="label-box" x="20" y="380" width="226" height="92" rx="8"/>
  <text class="label-main" x="40" y="413">中心区 / Downtown</text>
  <text class="label-coord" x="40" y="441">标注点：185, 198</text>

  <!-- Entrance: visual source anchor (230,95) -> display (646,242). -->
  <polyline class="leader" points="646,242 1014,242 1034,216"/>
  <circle class="target" cx="646" cy="242" r="10"/>
  <text class="number" x="646" y="242">3</text>
  <rect class="label-box" x="1034" y="170" width="226" height="92" rx="8"/>
  <text class="label-main" x="1054" y="203">城门 / Entrance</text>
  <text class="label-coord" x="1054" y="231">标注点：230, 95</text>

  <!-- Old Town: visual source anchor (281,168) -> display (727.6,358.8). -->
  <polyline class="leader" points="727.6,358.8 1014,358.8 1034,376"/>
  <circle class="target" cx="727.6" cy="358.8" r="10"/>
  <text class="number" x="727.6" y="358.8">4</text>
  <rect class="label-box" x="1034" y="330" width="226" height="92" rx="8"/>
  <text class="label-main" x="1054" y="363">旧城区 / Old Town</text>
  <text class="label-coord" x="1054" y="391">标注点：281, 168</text>

  <!-- Water Merchants: visual source anchor (229,249) -> display (644.4,488.4). -->
  <polyline class="leader" points="644.4,488.4 1014,488.4 1034,556"/>
  <circle class="target" cx="644.4" cy="488.4" r="10"/>
  <text class="number" x="644.4" y="488.4">5</text>
  <rect class="label-box" x="1034" y="510" width="226" height="92" rx="8"/>
  <text class="label-main" x="1054" y="543">纯水商人区</text>
  <text class="label-main" x="1054" y="566">Water Merchants</text>
  <text class="label-coord" x="1054" y="590">标注点：229, 249</text>

  <text x="640" y="850" class="subtitle" text-anchor="middle">标注点用于视觉排版；游戏按钮的精确坐标保存在 config/hub-town-map-hotspots.zh-CN.csv</text>
</svg>
