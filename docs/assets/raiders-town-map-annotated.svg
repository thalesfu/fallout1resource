<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.58"/>
    </filter>
    <style>
      .title { font: 700 28px "Hiragino Sans GB", "PingFang SC", sans-serif; fill: #eee3c4; }
      .subtitle { font: 14px "Hiragino Sans GB", "PingFang SC", sans-serif; fill: #b8ad94; }
      .label-main { font: 700 22px "Hiragino Sans GB", "PingFang SC", sans-serif; fill: #f8f5eb; }
      .label-detail { font: 14px ui-monospace, "SFMono-Regular", Menlo, monospace; fill: #b9eefd; }
      .label-box { fill: #111719; fill-opacity: 0.95; stroke: #63d8ee; stroke-width: 2; filter: url(#shadow); }
      .leader { fill: none; stroke: #63d8ee; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .target { fill: #0b1113; stroke: #63d8ee; stroke-width: 4; }
      .number { font: 700 13px ui-monospace, monospace; fill: #9decfa; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#0d1112"/>
  <text x="640" y="42" class="title" text-anchor="middle">Raiders 歹徒城镇地图</text>
  <text x="640" y="67" class="subtitle" text-anchor="middle">TWNMAP04 · 原作唯一城镇入口</text>

  <!-- Source poster: 453 × 444, scaled uniformly by 1.6. -->
  <rect x="106" y="84" width="736.8" height="722.4" rx="10" fill="#080a0a" stroke="#635e51" stroke-width="2"/>
  <image x="112" y="90" width="724.8" height="710.4" xlink:href="raiders-town-map-original.png"/>

  <!-- Base: source button anchor (241,398) -> display (497.6,726.8). -->
  <polyline class="leader" points="497.6,726.8 874,726.8 908,666"/>
  <circle class="target" cx="497.6" cy="726.8" r="11"/>
  <text class="number" x="497.6" y="726.8">1</text>
  <rect class="label-box" x="908" y="602" width="332" height="128" rx="9"/>
  <text class="label-main" x="932" y="642">主营地 / Base</text>
  <text class="label-detail" x="932" y="674">RAIDERS.MAP · 入口 1</text>
  <text class="label-detail" x="932" y="702">按钮锚点：241, 398</text>

  <text x="640" y="854" class="subtitle" text-anchor="middle">elevation 1 未被定义为城镇选择入口，因此不在本图标注。</text>
</svg>
